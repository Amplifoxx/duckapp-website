<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Reset Password — The Duck App</title>

  <meta
    name="description"
    content="Reset your The Duck App password."
  />

  <link rel="stylesheet" href="styles.css" />
</head>

<body class="reset-page">

  <header class="nav">
    <a href="index.html" class="brand">THE DUCK APP</a>

    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="support.html">Support</a>
    </nav>
  </header>


  <main class="reset-main">

    <div class="reset-duck" aria-hidden="true">
      <img src="./assets/duck_official.svg" alt="" />
    </div>

    <section class="reset-card">

      <p class="eyebrow">ACCOUNT SECURITY</p>

      <h1>
        RESET<br />
        PASSWORD.
      </h1>

      <p class="reset-copy" id="reset-copy">
        Verifying your password reset link...
      </p>

      <form id="reset-form" style="display: none;">

        <label for="password">
          NEW PASSWORD
        </label>

        <input
          id="password"
          name="password"
          type="password"
          autocomplete="new-password"
          placeholder="New password"
          minlength="8"
          required
        />

        <label for="confirm-password">
          CONFIRM PASSWORD
        </label>

        <input
          id="confirm-password"
          name="confirm-password"
          type="password"
          autocomplete="new-password"
          placeholder="Confirm password"
          minlength="8"
          required
        />

        <button
          type="submit"
          class="button reset-button"
        >
          UPDATE PASSWORD
        </button>

      </form>

      <p
        id="reset-message"
        class="reset-message"
        aria-live="polite"
      ></p>

      <a
        href="index.html"
        class="reset-back"
      >
        ← Back to The Duck App
      </a>

    </section>

  </main>


  <footer>

    <div class="footer-brand">
      THE DUCK APP
    </div>

    <div class="footer-links">
      <a href="support.html">Support</a>
      <a href="privacy.html">Privacy</a>
      <a href="terms.html">Terms</a>
    </div>

    <div class="copyright">
      © 2026 Michael Overton. All rights reserved.
    </div>

  </footer>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      'https://gssvklijklgfiiasvglj.supabase.co';

    const SUPABASE_PUBLISHABLE_KEY =
      'sb_publishable_-eyN1F3MZCsbfvc7VWmHoA_cW9ZI-Rs';

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const form =
      document.getElementById('reset-form');

    const message =
      document.getElementById('reset-message');

    const resetCopy =
      document.getElementById('reset-copy');

    const button =
      document.querySelector('.reset-button');


    function showResetForm() {
      resetCopy.textContent =
        'Enter a new password for your The Duck App account.';

      form.style.display = 'block';
    }


    function showInvalidLink() {
      resetCopy.textContent =
        'This password reset link is invalid or has expired.';

      message.textContent =
        'Please return to The Duck App and request a new password reset link.';

      message.className =
        'reset-message error';

      form.style.display = 'none';
    }


    async function initializeRecoverySession() {
      try {
        const url =
          new URL(window.location.href);

        /*
          Supabase PKCE recovery links may return a code
          in the query string.
        */
        const code =
          url.searchParams.get('code');

        if (code) {
          const { error } =
            await supabaseClient.auth.exchangeCodeForSession(
              code
            );

          if (error) {
            throw error;
          }

          window.history.replaceState(
            {},
            document.title,
            window.location.pathname
          );

          showResetForm();
          return;
        }

        /*
          Some Supabase auth flows return tokens in the
          URL hash instead.
        */
        const hashParams =
          new URLSearchParams(
            window.location.hash.substring(1)
          );

        const accessToken =
          hashParams.get('access_token');

        const refreshToken =
          hashParams.get('refresh_token');

        if (accessToken && refreshToken) {
          const { error } =
            await supabaseClient.auth.setSession({
              access_token: accessToken,
              refresh_token: refreshToken,
            });

          if (error) {
            throw error;
          }

          window.history.replaceState(
            {},
            document.title,
            window.location.pathname
          );

          showResetForm();
          return;
        }

        /*
          The browser may already have a valid recovery
          session.
        */
        const {
          data: { session },
        } =
          await supabaseClient.auth.getSession();

        if (session) {
          showResetForm();
          return;
        }

        showInvalidLink();

      } catch (error) {
        console.error(
          'Recovery session error:',
          error
        );

        showInvalidLink();
      }
    }


    form.addEventListener(
      'submit',
      async (event) => {
        event.preventDefault();

        const password =
          document.getElementById('password').value;

        const confirmPassword =
          document.getElementById(
            'confirm-password'
          ).value;

        message.textContent = '';
        message.className = 'reset-message';

        if (password.length < 8) {
          message.textContent =
            'Your password must be at least 8 characters.';

          message.classList.add('error');
          return;
        }

        if (password !== confirmPassword) {
          message.textContent =
            'The passwords do not match.';

          message.classList.add('error');
          return;
        }

        button.disabled = true;
        button.textContent = 'UPDATING...';

        try {
          const { error } =
            await supabaseClient.auth.updateUser({
              password,
            });

          if (error) {
            throw error;
          }

          /*
            Sign out of the temporary browser recovery
            session after the password has been changed.
          */
          await supabaseClient.auth.signOut();

          form.reset();
          form.style.display = 'none';

          resetCopy.textContent =
            'Your password has been updated.';

          message.textContent =
            'You can now return to The Duck App and sign in with your new password.';

          message.className =
            'reset-message success';

        } catch (error) {
          console.error(
            'Password reset error:',
            error
          );

          message.textContent =
            error.message ||
            'Unable to update your password. Please request a new reset link and try again.';

          message.classList.add('error');

          button.disabled = false;
          button.textContent =
            'UPDATE PASSWORD';
        }
      }
    );


    initializeRecoverySession();
  </script>

</body>
</html>
