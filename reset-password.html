<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Reset Password — The Duck App</title>

  <meta
    name="description"
    content="Reset your The Duck App password."
  />

  <link rel="stylesheet" href="styles.css" />
</head>

<body class="reset-page">

  <!-- NAV -->
  <header class="nav">
    <a href="index.html" class="brand">THE DUCK APP</a>

    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="support.html">Support</a>
    </nav>
  </header>


  <main class="reset-main">

    <div class="reset-duck" aria-hidden="true">
      <img src="./assets/duck_official.svg" alt="" />
    </div>

    <section class="reset-card">

      <p class="eyebrow">ACCOUNT SECURITY</p>

      <h1>
        RESET<br />
        PASSWORD.
      </h1>

      <p class="reset-copy">
        Enter a new password for your The Duck App account.
      </p>

      <form id="reset-form">

        <label for="password">
          NEW PASSWORD
        </label>

        <input
          id="password"
          name="password"
          type="password"
          autocomplete="new-password"
          placeholder="New password"
          minlength="8"
          required
        />

        <label for="confirm-password">
          CONFIRM PASSWORD
        </label>

        <input
          id="confirm-password"
          name="confirm-password"
          type="password"
          autocomplete="new-password"
          placeholder="Confirm password"
          minlength="8"
          required
        />

        <button
          type="submit"
          class="button reset-button"
        >
          UPDATE PASSWORD
        </button>

      </form>

      <p
        id="reset-message"
        class="reset-message"
        aria-live="polite"
      ></p>

      <a
        href="index.html"
        class="reset-back"
      >
        ← Back to The Duck App
      </a>

    </section>

  </main>


  <footer>

    <div class="footer-brand">
      THE DUCK APP
    </div>

    <div class="footer-links">
      <a href="support.html">Support</a>
      <a href="privacy.html">Privacy</a>
      <a href="terms.html">Terms</a>
    </div>

    <div class="copyright">
      © 2026 Michael Overton. All rights reserved.
    </div>

  </footer>


  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const form = document.getElementById('reset-form');
    const message = document.getElementById('reset-message');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const password =
        document.getElementById('password').value;

      const confirmPassword =
        document.getElementById('confirm-password').value;

      message.textContent = '';
      message.className = 'reset-message';

      if (password.length < 8) {
        message.textContent =
          'Your password must be at least 8 characters.';
        message.classList.add('error');
        return;
      }

      if (password !== confirmPassword) {
        message.textContent =
          'The passwords do not match.';
        message.classList.add('error');
        return;
      }

      const button =
        document.querySelector('.reset-button');

      button.disabled = true;
      button.textContent = 'UPDATING...';

      try {
        const { error } =
          await supabaseClient.auth.updateUser({
            password: password,
          });

        if (error) {
          throw error;
        }

        message.textContent =
          'Password updated successfully. You can now return to The Duck App and sign in.';

        message.classList.add('success');

        form.reset();

        button.textContent = 'PASSWORD UPDATED';

      } catch (error) {

        console.error(
          'Password reset error:',
          error
        );

        message.textContent =
          error.message ||
          'Unable to update your password. Please request a new reset link and try again.';

        message.classList.add('error');

        button.disabled = false;
        button.textContent = 'UPDATE PASSWORD';
      }
    });
  </script>

</body>
</html>
