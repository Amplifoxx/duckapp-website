<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script>
    /*
     * GitHub Pages sends unknown routes to 404.html.
     *
     * /redeem/* keeps its existing homepage fallback.
     *
     * /user/* stays on its permanent HTTPS URL and
     * becomes a Duck App profile handoff page for
     * visitors who reach the website instead of the app.
     */
    (function () {
      var path = window.location.pathname || "";
      var redeemPattern = /^\/redeem\/[^/]+\/?$/i;
      var userPattern = /^\/user\/([^/]+)\/?$/i;

      if (redeemPattern.test(path)) {
        window.location.replace("/");
        return;
      }

      var userMatch = path.match(userPattern);

      if (!userMatch) {
        return;
      }

      document.addEventListener(
        "DOMContentLoaded",
        function () {
          var userId = userMatch[1];

          document.title =
            "Duck App Profile — The Duck App";

          var description =
            document.querySelector(
              'meta[name="description"]'
            );

          if (description) {
            description.setAttribute(
              "content",
              "Open this profile in The Duck App."
            );
          }

          var pageEyebrow =
            document.getElementById(
              "page-eyebrow"
            );

          var pageTitle =
            document.getElementById(
              "page-title"
            );

          var pageIntro =
            document.getElementById(
              "page-intro"
            );

          var panelEyebrow =
            document.getElementById(
              "panel-eyebrow"
            );

          var panelHeading =
            document.getElementById(
              "error-heading"
            );

          var panelCopy =
            document.getElementById(
              "panel-copy"
            );

          var primaryButton =
            document.getElementById(
              "primary-button"
            );

            var downloadButton =
  document.getElementById(
    "download-button"
  );

          if (pageEyebrow) {
            pageEyebrow.textContent =
              "THE DUCK APP";
          }

          if (pageTitle) {
            pageTitle.innerHTML =
              "YOU FOUND A<br />DUCK APP USER.";
          }

          if (pageIntro) {
            pageIntro.textContent =
              "Open The Duck App to view their profile.";
          }

          if (panelEyebrow) {
            panelEyebrow.textContent =
              "DUCK APP PROFILE";
          }

          if (panelHeading) {
            panelHeading.textContent =
              "VIEW THEIR PROFILE.";
          }

          if (panelCopy) {
            panelCopy.textContent =
              "This QR belongs to a Duck App user. Open The Duck App to view their Jeep, check out their duck collection, and send them a duck.";
          }

          if (primaryButton) {
            primaryButton.textContent =
              "OPEN THE DUCK APP";

              if (downloadButton) {
  downloadButton.hidden = false;
}

            primaryButton.href =
              "theduckapp://user/" +
              encodeURIComponent(userId);
          }
        }
      );
    })();
  </script>

  <title>Page Not Found — The Duck App</title>

  <meta
    name="description"
    content="The page you're looking for could not be found."
  />

  <style>
    /* =========================================================
       THE DUCK APP — 404
       ========================================================= */

    :root {
      --yellow: #ffd000;
      --black: #050505;
      --white: #f7f7f2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      background: var(--yellow);
      color: var(--black);
      font-family: -apple-system, BlinkMacSystemFont, system-ui,
             "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================================================
       MAIN
       ========================================================= */

    main {
      position: relative;
      flex: 1 0 auto;
      display: flex;
      flex-direction: column;
      width: 100%;
      min-width: 0;
      padding: 110px 8vw 65px;
      overflow: hidden;
      isolation: isolate;
      background: var(--yellow);
    }

    /* =========================================================
       BACKGROUND DUCK
       ========================================================= */

    .background-duck {
      position: absolute;
      z-index: 0;
      top: -100px;
      left: 0;
      width: max(80vw, 1100px);
      transform: translate(-96%, -11%) rotate(-8deg);
      opacity: 0.06;
      pointer-events: none;
      user-select: none;
    }

    .background-duck img {
      display: block;
      width: 200%;
      height: auto;
    }

    /* =========================================================
       BACKGROUND GRADIENT
       ========================================================= */

    .page-gradient {
      position: absolute;
      z-index: 1;
      inset: 0;
      background: linear-gradient(
        to left,
        rgba(105, 72, 0, 0.30) 0%,
        rgba(105, 72, 0, 0.15) 25%,
        rgba(105, 72, 0, 0.00) 50%,
        rgba(105, 72, 0, 0.05) 75%,
        rgba(105, 72, 0, 0.10) 100%
      );
      pointer-events: none;
    }

    /* =========================================================
       CONTENT
       ========================================================= */

    .page-content {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1600px;
      margin: auto;
    }

    .eyebrow {
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    /* =========================================================
       PAGE HEADING
       ========================================================= */

    .page-heading {
      margin-bottom: 38px;
    }

    .page-heading .eyebrow {
      margin-bottom: 12px;
    }

    .page-heading h1 {
      font-size: clamp(50px, 5.2vw, 90px);
      font-weight: 900;
      line-height: 0.88;
     letter-spacing: -0.045em;
      margin-left: -0.065em;
      text-transform: uppercase;
    }

    .page-intro {
      max-width: 650px;
      margin-top: 20px;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.6;
    }

    /* =========================================================
       ERROR LAYOUT
       ========================================================= */

    .error-layout {
      display: grid;
      grid-template-columns:
        minmax(0, 1fr)
        minmax(0, 650px);
      gap: clamp(35px, 6vw, 110px);
      align-items: start;
    }

    .error-panel {
      min-width: 0;
      padding: 34px;
      background: var(--black);
      color: var(--white);
    }

    .error-panel .eyebrow {
      margin-bottom: 12px;
      color: var(--yellow);
    }

    .error-panel h2 {
      font-size: clamp(26px, 2.5vw, 38px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.055em;
      text-transform: uppercase;
    }

    .error-copy {
      max-width: 480px;
      margin-top: 16px;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.7;
      color: #bcbcbc;
    }

    /* =========================================================
       BUTTON
       ========================================================= */

    .error-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 50px;
      margin-top: 28px;
      padding: 0 20px;
      border: 2px solid var(--yellow);
      background: var(--yellow);
      color: var(--black);
      font-family: inherit;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-align: center;
      transition:
        background 180ms ease,
        color 180ms ease;
    }

    .error-button:hover {
      background: transparent;
      color: var(--yellow);
    }

    .error-button:focus-visible {
      outline: 2px solid var(--yellow);
      outline-offset: 4px;
    }

    .secondary-button {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 50px;
  margin-top: 12px;
  padding: 0 20px;
  border: 2px solid #444;
  background: transparent;
  color: #777;
  font-family: inherit;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 0.1em;
  text-align: center;
  cursor: default;
}

.secondary-button-note {
  margin-left: 8px;
  color: #555;
  font-size: 9px;
  letter-spacing: 0.08em;
}

    /* =========================================================
       TABLET
       ========================================================= */

    @media (max-width: 1000px) {

      main {
        padding: 110px 24px 55px;
      }

      .error-layout {
        grid-template-columns:
          minmax(0, 1fr)
          minmax(0, 650px);
        gap: 30px;
      }
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 600px) {

      main {
        padding: 105px 20px 45px;
      }

      .page-heading {
        margin-bottom: 34px;
      }

      .page-heading h1 {
        font-size: clamp(42px, 9vw, 70px);
      }

      .page-intro {
        margin-top: 18px;
        font-size: 12px;
      }

      .error-layout {
        display: block;
      }

      .error-panel {
        padding: 26px 22px;
      }

      .error-panel h2 {
        font-size: 28px;
      }

      .error-copy {
        font-size: 12px;
      }
    }
  </style>
  <link rel="stylesheet" href="/components/header.css" />
  <link rel="stylesheet" href="/components/footer.css" />
  <script src="/components/site-components.js" defer></script>
</head>

<body>

  <!-- NAVIGATION -->

  {{ header }}

  <!-- MAIN -->

  <main>

    <div
      class="background-duck"
      aria-hidden="true"
    >
      <img
        src="/assets/duck_official.svg"
        alt=""
      />
    </div>

    <div
      class="page-gradient"
      aria-hidden="true"
    ></div>

    <div class="page-content">

      <!-- HEADING -->

      <div class="page-heading">
        <p
          class="eyebrow"
          id="page-eyebrow"
        >
          ERROR 404
        </p>

        <h1 id="page-title">
          THAT PAGE<br />
          DOESN'T EXIST.
        </h1>

        <p
          class="page-intro"
          id="page-intro"
        >
          Looks like this duck wandered off.
        </p>
      </div>

      <!-- ERROR / PROFILE PANEL -->

      <div class="error-layout">

        <div aria-hidden="true"></div>

        <section
          class="error-panel"
          aria-labelledby="error-heading"
        >

          <p
            class="eyebrow"
            id="panel-eyebrow"
          >
            PAGE NOT FOUND
          </p>

          <h2 id="error-heading">
            NOTHING HERE.
          </h2>

          <p
            class="error-copy"
            id="panel-copy"
          >
            The page you're looking for may have
            moved, been removed, or never existed.
          </p>

          <a
            href="/"
            class="error-button"
            id="primary-button"
          >
            BACK TO THE DUCK APP
          </a>

          <div
  class="secondary-button"
  id="download-button"
  hidden
  aria-disabled="true"
>
  GET THE DUCK APP
  <span class="secondary-button-note">
    COMING SOON
  </span>
</div>

        </section>

      </div>

    </div>

  </main>

  <!-- FOOTER -->

  {{ footer }}

</body>
</html>
