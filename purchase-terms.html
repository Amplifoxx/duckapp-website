<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0" />



<title>Purchase Terms — The Duck App</title>

<meta name="description" content="Purchase Terms for The Duck App." />



<style>

:root {

&#x20; \--yellow: #ffd000;

&#x20; \--black: #050505;

&#x20; \--white: #f7f7f2;

}



* {

&#x20; box-sizing: border-box;

&#x20; margin: 0;

&#x20; padding: 0;

}



html {

&#x20; min-height: 100%;

&#x20; scroll-behavior: smooth;

}



body {

&#x20; min-height: 100vh;

&#x20; min-height: 100svh;

&#x20; display: flex;

&#x20; flex-direction: column;

&#x20; background: var(--yellow);

&#x20; color: var(--black);

&#x20; font-family: Arial, Helvetica, sans-serif;

&#x20; -webkit-font-smoothing: antialiased;

}



a {

&#x20; color: inherit;

&#x20; text-decoration: none;

}



/* =========================================================

&#x20;  NAVIGATION

&#x20;  \========================================================= */



.nav {

&#x20; position: absolute;

&#x20; z-index: 100;

&#x20; top: 0;

&#x20; left: 0;

&#x20; width: 100%;

&#x20; display: flex;

&#x20; align-items: center;

&#x20; justify-content: space-between;

&#x20; padding: 24px 42px;

&#x20; background: transparent;

}



.brand {

&#x20; font-size: 16px;

&#x20; font-weight: 900;

&#x20; letter-spacing: -.02em;

&#x20; white-space: nowrap;

}



.nav-links {

&#x20; display: flex;

&#x20; align-items: center;

&#x20; gap: 32px;

}



.nav-links a {

&#x20; position: relative;

&#x20; font-size: 11px;

&#x20; font-weight: 800;

&#x20; letter-spacing: .12em;

&#x20; text-transform: uppercase;

&#x20; white-space: nowrap;

}



.nav-links a::after {

&#x20; content: "";

&#x20; position: absolute;

&#x20; left: 0;

&#x20; bottom: -7px;

&#x20; width: 0;

&#x20; height: 2px;

&#x20; background: var(--black);

&#x20; transition: width 180ms ease;

}



.nav-links a:hover::after {

&#x20; width: 100%;

}



/* =========================================================

&#x20;  PAGE

&#x20;  \========================================================= */



main {

&#x20; position: relative;

&#x20; flex: 1 0 auto;

&#x20; width: 100%;

&#x20; padding: 105px 8vw 75px;

&#x20; overflow: hidden;

&#x20; isolation: isolate;

&#x20; background: var(--yellow);

}



.background-duck {

&#x20; position: absolute;

&#x20; z-index: 0;

&#x20; top: -100px;

&#x20; left: 0;

&#x20; width: max(80vw, 1100px);

&#x20; transform: translate(-96%, -11%) rotate(-8deg);

&#x20; opacity: .06;

&#x20; pointer-events: none;

&#x20; user-select: none;

}



.background-duck img {

&#x20; display: block;

&#x20; width: 200%;

&#x20; height: auto;

}



.page-gradient {

&#x20; position: absolute;

&#x20; z-index: 1;

&#x20; inset: 0;

&#x20; background: linear-gradient(

&#x20;   to left,

&#x20;   rgba(105,72,0,.30) 0%,

&#x20;   rgba(105,72,0,.15) 25%,

&#x20;   rgba(105,72,0,0) 50%,

&#x20;   rgba(105,72,0,.05) 75%,

&#x20;   rgba(105,72,0,.10) 100%

&#x20; );

&#x20; pointer-events: none;

}



.page-content {

&#x20; position: relative;

&#x20; z-index: 2;

&#x20; width: 100%;

&#x20; max-width: 1600px;

&#x20; margin: 0 auto;

}



.eyebrow {

&#x20; font-size: 11px;

&#x20; font-weight: 900;

&#x20; letter-spacing: .18em;

&#x20; text-transform: uppercase;

}



/* =========================================================

&#x20;  HERO

&#x20;  \========================================================= */



.page-heading {

&#x20; display: flex;

&#x20; align-items: flex-end;

&#x20; justify-content: space-between;

&#x20; gap: 32px;

&#x20; margin-bottom: 54px;

}



.page-heading .eyebrow {

&#x20; margin-bottom: 12px;

}



.page-heading h1 {

&#x20; font-size: clamp(50px, 5.2vw, 90px);

&#x20; font-weight: 900;

&#x20; line-height: .88;

&#x20; letter-spacing: -.085em;

&#x20; margin-left: -.065em;

&#x20; text-transform: uppercase;

}



.updated {

&#x20; font-size: 11px;

&#x20; font-weight: 700;

&#x20; white-space: nowrap;

&#x20; padding-bottom: 4px;

}



/* =========================================================

&#x20;  CONTINUOUS LEGAL DOCUMENT

&#x20;  \========================================================= */



.document-layout {

&#x20; display: grid;

&#x20; grid-template-columns: minmax(0, 1fr) minmax(0, 850px);

&#x20; gap: clamp(35px, 6vw, 110px);

}



.legal-document {

&#x20; min-width: 0;

&#x20; font-size: 13px;

&#x20; font-weight: 500;

&#x20; line-height: 1.8;

}



.legal-document section {

&#x20; padding: 0 0 26px;

&#x20; margin-bottom: 27px;

&#x20; border-bottom: 1px solid rgba(0,0,0,.22);

}



.legal-document section:first-child {

&#x20; padding-bottom: 32px;

&#x20; border-bottom: 2px solid var(--black);

}



.legal-document section:first-child p {

&#x20; font-size: 15px;

&#x20; font-weight: 700;

&#x20; line-height: 1.7;

}



.legal-document h2 {

&#x20; margin-bottom: 13px;

&#x20; font-size: clamp(18px, 1.65vw, 24px);

&#x20; font-weight: 900;

&#x20; line-height: 1.15;

&#x20; letter-spacing: -.045em;

&#x20; text-transform: uppercase;

}



.legal-document p + p {

&#x20; margin-top: 14px;

}



.legal-document a {

&#x20; font-weight: 800;

&#x20; text-decoration: underline;

&#x20; text-underline-offset: 3px;

}



.legal-document a:hover {

&#x20; text-decoration-thickness: 2px;

}



.legal-related {

&#x20; padding-top: 5px;

&#x20; font-size: 12px;

&#x20; font-weight: 600;

&#x20; line-height: 1.7;

}



/* =========================================================

&#x20;  FOOTER

&#x20;  \========================================================= */



footer {

&#x20; position: relative;

&#x20; z-index: 10;

&#x20; flex: 0 0 auto;

&#x20; width: 100%;

&#x20; margin-top: auto;

&#x20; padding: 20px 8vw;

&#x20; background: var(--black);

&#x20; color: var(--white);

}



.footer-inner {

&#x20; display: flex;

&#x20; align-items: center;

&#x20; justify-content: space-between;

&#x20; flex-wrap: nowrap;

&#x20; gap: 24px;

}



.copyright {

&#x20; flex: 0 0 auto;

&#x20; font-size: 10px;

&#x20; font-weight: 600;

&#x20; letter-spacing: .03em;

&#x20; color: #777;

&#x20; white-space: nowrap;

}



.footer-links {

&#x20; display: flex;

&#x20; align-items: center;

&#x20; justify-content: flex-end;

&#x20; flex-wrap: nowrap;

&#x20; gap: 28px;

&#x20; white-space: nowrap;

}



.footer-links a {

&#x20; font-size: 10px;

&#x20; font-weight: 800;

&#x20; letter-spacing: .1em;

&#x20; text-transform: uppercase;

&#x20; color: #bcbcbc;

&#x20; white-space: nowrap;

}



.footer-links a:hover {

&#x20; color: var(--yellow);

}



/* =========================================================

&#x20;  TABLET

&#x20;  \========================================================= */



@media (max-width: 1000px) {

&#x20; .nav {

&#x20;   padding: 24px;

&#x20; }



&#x20; main {

&#x20;   padding: 105px 24px 55px;

&#x20; }



&#x20; .document-layout {

&#x20;   grid-template-columns: minmax(0, 1fr) minmax(0, 750px);

&#x20;   gap: 30px;

&#x20; }



&#x20; footer {

&#x20;   padding-left: 24px;

&#x20;   padding-right: 24px;

&#x20; }



&#x20; .footer-links {

&#x20;   gap: 18px;

&#x20; }

}



/* =========================================================

&#x20;  MOBILE

&#x20;  \========================================================= */



@media (max-width: 600px) {

&#x20; .nav {

&#x20;   padding: 22px 20px;

&#x20; }



&#x20; .brand {

&#x20;   font-size: 13px;

&#x20; }



&#x20; .nav-links {

&#x20;   gap: 16px;

&#x20; }



&#x20; .nav-links a {

&#x20;   font-size: 9px;

&#x20; }



&#x20; main {

&#x20;   padding: 100px 20px 45px;

&#x20; }



&#x20; .page-heading {

&#x20;   display: block;

&#x20;   margin-bottom: 38px;

&#x20; }



&#x20; .page-heading h1 {

&#x20;   font-size: clamp(48px, 11vw, 70px);

&#x20; }



&#x20; .updated {

&#x20;   margin-top: 16px;

&#x20; }



&#x20; .document-layout {

&#x20;   display: block;

&#x20; }



&#x20; .legal-document {

&#x20;   font-size: 12px;

&#x20;   line-height: 1.75;

&#x20; }



&#x20; .legal-document section {

&#x20;   padding-bottom: 24px;

&#x20;   margin-bottom: 25px;

&#x20; }



&#x20; .legal-document section:first-child p {

&#x20;   font-size: 13px;

&#x20; }



&#x20; .legal-document h2 {

&#x20;   font-size: 19px;

&#x20; }



&#x20; /* MOBILE FOOTER — WRAPPING LINKS */



&#x20; footer {

&#x20;   width: 100%;

&#x20;   padding:

&#x20;     22px max(16px, env(safe-area-inset-right))

&#x20;     max(22px, env(safe-area-inset-bottom))

&#x20;     max(16px, env(safe-area-inset-left));

&#x20;   overflow: hidden;

&#x20; }



&#x20; .footer-inner {

&#x20;   display: flex;

&#x20;   flex-direction: column-reverse;

&#x20;   align-items: center;

&#x20;   justify-content: center;

&#x20;   width: 100%;

&#x20;   min-width: 0;

&#x20;   gap: 18px;

&#x20; }



&#x20; .footer-links {

&#x20;   display: flex;

&#x20;   flex-direction: row;

&#x20;   align-items: center;

&#x20;   justify-content: center;

&#x20;   flex-wrap: wrap;

&#x20;   width: 100%;

&#x20;   gap: 12px 20px;

&#x20;   white-space: normal;

&#x20; }



&#x20; .footer-links a {

&#x20;   flex-shrink: 0;

&#x20;   font-size: 9px;

&#x20;   white-space: nowrap;

&#x20; }



&#x20; .copyright {

&#x20;   flex: 0 1 auto;

&#x20;   font-size: 9px;

&#x20;   text-align: center;

&#x20;   white-space: normal;

&#x20; }

}



/* =========================================================

&#x20;  PRINT / SAVE AS PDF

&#x20;  \========================================================= */



@media print {

&#x20; @page {

&#x20;   margin: 18mm;

&#x20; }



&#x20; html,

&#x20; body {

&#x20;   display: block;

&#x20;   min-height: 0;

&#x20;   background: white !important;

&#x20;   color: black !important;

&#x20; }



&#x20; .nav,

&#x20; .background-duck,

&#x20; .page-gradient,

&#x20; footer {

&#x20;   display: none !important;

&#x20; }



&#x20; main {

&#x20;   padding: 0 !important;

&#x20;   overflow: visible !important;

&#x20;   background: white !important;

&#x20; }



&#x20; .page-content {

&#x20;   max-width: none;

&#x20; }



&#x20; .page-heading {

&#x20;   margin-bottom: 25px;

&#x20; }



&#x20; .page-heading h1 {

&#x20;   font-size: 38pt;

&#x20; }



&#x20; .document-layout {

&#x20;   display: block;

&#x20; }



&#x20; .legal-document {

&#x20;   font-size: 10pt;

&#x20;   line-height: 1.5;

&#x20; }



&#x20; .legal-document section {

&#x20;   break-inside: auto;

&#x20; }



&#x20; .legal-document h2 {

&#x20;   font-size: 13pt;

&#x20;   break-after: avoid;

&#x20;   page-break-after: avoid;

&#x20; }



&#x20; .legal-document p {

&#x20;   orphans: 3;

&#x20;   widows: 3;

&#x20; }

}

</style>
