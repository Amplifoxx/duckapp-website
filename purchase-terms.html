<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0" />



<title>Purchase Terms — The Duck App</title>

<meta name="description" content="Purchase Terms for The Duck App." />



<style>

:root {

  --yellow: #000000;

  --black: #050505;

  --white: #f7f7f2;

}



* {

  box-sizing: border-box;

  margin: 0;

  padding: 0;

}



html {

  min-height: 100%;

  scroll-behavior: smooth;

}



body {

  min-height: 100vh;

  min-height: 100svh;

  display: flex;

  flex-direction: column;

  background: var(--yellow);

  color: var(--black);

  font-family: -apple-system, BlinkMacSystemFont, system-ui,
             "Segoe UI", Arial, sans-serif;

  -webkit-font-smoothing: antialiased;

}



a {

  color: inherit;

  text-decoration: none;

}



/* =========================================================

   PAGE

   \========================================================= */



main {

  position: relative;

  flex: 1 0 auto;

  width: 100%;

  padding: 105px 8vw 75px;

  overflow: hidden;

  isolation: isolate;

  background: var(--yellow);

}



.background-duck {

  position: absolute;

  z-index: 2;

  top: -100px;

  left: 0;

  width: max(80vw, 1100px);

  transform: translate(-96%, -11%) rotate(-8deg);

  opacity: .06;

  pointer-events: none;

  user-select: none;

}



.background-duck img {

  display: block;

  width: 200%;

  height: auto;

}



.page-gradient {

  position: absolute;
      z-index: 1;
      inset: 0;
      background: linear-gradient(
        to left,
        rgba(236, 161, 0, 1.0) 0%,
        rgb(255, 196, 0) 50%,
        rgb(210, 157, 0) 100%
      );
      pointer-events: none;
    }



.page-content {

  position: relative;

  z-index: 2;

  width: 100%;

  max-width: 1600px;

  margin: 0 auto;

}



.eyebrow {

  font-size: 11px;

  font-weight: 900;

  letter-spacing: .18em;

  text-transform: uppercase;

}



/* =========================================================

   HERO

   \========================================================= */



.page-heading {

  display: flex;

  align-items: flex-end;

  justify-content: space-between;

  gap: 32px;

  margin-bottom: 54px;

}



.page-heading .eyebrow {

  margin-bottom: 12px;

}



.page-heading h1 {

  font-size: clamp(50px, 5.2vw, 90px);

  font-weight: 900;

  line-height: .88;

  letter-spacing: -0.045em;

  margin-left: -.065em;

  text-transform: uppercase;

}



.updated {

  font-size: 11px;

  font-weight: 700;

  white-space: nowrap;

  padding-bottom: 4px;

}



/* =========================================================

   CONTINUOUS LEGAL DOCUMENT

   \========================================================= */



.document-layout {

  display: grid;

  grid-template-columns: minmax(0, 1fr) minmax(0, 850px);

  gap: clamp(35px, 6vw, 110px);

}



.legal-document {

  min-width: 0;

  font-size: 13px;

  font-weight: 500;

  line-height: 1.8;

}



.legal-document section {

  padding: 0 0 26px;

  margin-bottom: 27px;

  border-bottom: 1px solid rgba(0,0,0,.22);

}



.legal-document section:first-child {

  padding-bottom: 32px;

  border-bottom: 2px solid var(--black);

}



.legal-document section:first-child p {

  font-size: 15px;

  font-weight: 700;

  line-height: 1.7;

}



.legal-document h2 {

  margin-bottom: 13px;

  font-size: clamp(18px, 1.65vw, 24px);

  font-weight: 900;

  line-height: 1.15;

  letter-spacing: -.045em;

  text-transform: uppercase;

}



.legal-document p + p {

  margin-top: 14px;

}



.legal-document a {

  font-weight: 800;

  text-decoration: underline;

  text-underline-offset: 3px;

}



.legal-document a:hover {

  text-decoration-thickness: 2px;

}



.legal-related {

  padding-top: 5px;

  font-size: 12px;

  font-weight: 600;

  line-height: 1.7;

}



/* =========================================================

   TABLET

   \========================================================= */



@media (max-width: 1000px) {



  main {

    padding: 105px 24px 55px;

  }



  .document-layout {

    grid-template-columns: minmax(0, 1fr) minmax(0, 750px);

    gap: 30px;

  }

}



/* =========================================================

   MOBILE

   \========================================================= */



@media (max-width: 600px) {



  main {

    padding: 100px 20px 45px;

  }



  .page-heading {

    display: block;

    margin-bottom: 38px;

  }



  .page-heading h1 {

    font-size: clamp(48px, 11vw, 70px);

  }



  .updated {

    margin-top: 16px;

  }



  .document-layout {

    display: block;

  }



  .legal-document {

    font-size: 12px;

    line-height: 1.75;

  }



  .legal-document section {

    padding-bottom: 24px;

    margin-bottom: 25px;

  }



  .legal-document section:first-child p {

    font-size: 13px;

  }



  .legal-document h2 {

    font-size: 19px;

  }

}



/* =========================================================

   PRINT / SAVE AS PDF

   \========================================================= */



@media print {

  @page {

    margin: 18mm;

  }



  html,

  body {

    display: block;

    min-height: 0;

    background: white !important;

    color: black !important;

  }
.background-duck,
.page-gradient {

    display: none !important;

  }



  main {

    padding: 0 !important;

    overflow: visible !important;

    background: white !important;

  }



  .page-content {

    max-width: none;

  }



  .page-heading {

    margin-bottom: 25px;

  }



  .page-heading h1 {

    font-size: 38pt;

  }



  .document-layout {

    display: block;

  }



  .legal-document {

    font-size: 10pt;

    line-height: 1.5;

  }



  .legal-document section {

    break-inside: auto;

  }



  .legal-document h2 {

    font-size: 13pt;

    break-after: avoid;

    page-break-after: avoid;

  }



  .legal-document p {

    orphans: 3;

    widows: 3;

  }

}

</style>
